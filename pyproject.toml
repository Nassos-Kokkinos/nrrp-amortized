[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nrrp-amortized"
version = "0.1.0"
description = "Nurse re-rostering as amortized optimization: constructive MDP, action masking, CP repair"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["nrrp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
