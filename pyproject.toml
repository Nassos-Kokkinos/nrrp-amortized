[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nrrp-amortized"
version = "0.1.0"
description = "Nurse re-rostering as amortized optimization: constructive MDP, action masking, CP repair"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]
cp = ["ortools>=9.10"]        # CP-SAT (nrrp/cpsat.py); no wheel for Python 3.15 yet (October 2026)
plot = ["matplotlib>=3.7"]    # figures (scripts/plot_results.py)
rl = ["torch>=2.2", "gymnasium>=1.0", "stable-baselines3>=2.3", "sb3-contrib>=2.3", "tensorboard>=2.14"]
                              # training (nrrp/gym_env.py, nrrp/policy.py, scripts/train.py)

[tool.setuptools]
packages = ["nrrp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
