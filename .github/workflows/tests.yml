name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,cp,plot]"
      # training libraries: CPU-only torch (the PyPI wheel pulls the CUDA stack), and not on
      # Python 3.9, which current torch no longer supports; tests/test_rl.py skips without them
      - if: matrix.python-version != '3.9'
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[rl]"
      - run: pytest
